name: beta-release

on:
  push:
    tags:
      - "v0.8.0-rc.1"

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Validate tagged source and RC safety
        shell: pwsh
        run: |
          if ("v$((Get-Content .\plugins\ai-video-channel-production\.codex-plugin\plugin.json -Raw | ConvertFrom-Json).version)" -ne "${{ github.ref_name }}") { throw "Tag and plugin version differ." }
          .\tools\Test-Stage1.ps1 -SkipCodexLoadSmoke
          uv run python -m unittest -q tests.test_stage8_release_candidate
      - name: Build release assets
        shell: pwsh
        run: .\tools\Build-ReleaseCandidate.ps1
      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            .\dist\v0.8.0-rc.1\ai-video-channel-production-v0.8.0-rc.1-windows.zip `
            .\dist\v0.8.0-rc.1\SHA256SUMS.txt `
            --verify-tag `
            --prerelease `
            --latest=false `
            --title "AI 视频频道生产系统 ${{ github.ref_name }}" `
            --notes-file .\docs\release-notes-v0.8.0-rc.1.md
