name: unified-release-preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-preflight-only:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Validate source and plugin marketplace
        shell: pwsh
        run: |
          uv sync --locked
          uv run python tools/validate_plugin.py
          uv run python -m unittest discover -s tests -p "test_*.py" -q
      - name: Explain local desktop asset gate
        shell: pwsh
        run: |
          Write-Output "PASS: source preflight only."
          Write-Output "The workshop, publisher center, and standalone runtime are frozen local desktop assets."
          Write-Output "CI must not create a tag or Release when those exact hash-locked assets are absent."
          Write-Output "After explicit approval, use tools/Publish-UnifiedRelease.ps1 against the locally validated asset directory."
