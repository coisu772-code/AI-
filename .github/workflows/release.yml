name: beta-release

on:
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Validate tagged source
        shell: pwsh
        run: .\tools\Test-Stage1.ps1 -SkipCodexLoadSmoke
      - name: Build release assets
        shell: pwsh
        run: .\tools\Build-BetaRelease.ps1
      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            .\dist\ai-video-channel-production-v0.1.0-beta.1.zip `
            .\dist\SHA256SUMS.txt `
            --verify-tag `
            --prerelease `
            --latest=false `
            --title "AI 视频频道生产系统 ${{ github.ref_name }}" `
            --notes-file .\docs\release-notes-v0.1.0-beta.1.md
