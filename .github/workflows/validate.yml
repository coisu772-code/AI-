name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts-and-plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Validate phase 1 release skeleton
        shell: pwsh
        run: .\tools\Test-Stage1.ps1 -SkipCodexLoadSmoke
